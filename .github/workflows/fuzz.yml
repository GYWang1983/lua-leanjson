name: Timed Fuzzing

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds per fuzz target (default: 60)"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Timed fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (nightly)
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Cache cargo registry & fuzz target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: timed-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            timed-fuzz-${{ runner.os }}-${{ runner.arch }}-

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo +nightly install --version 0.13.2 --locked cargo-fuzz
          fi

      - name: Run timed fuzz targets
        env:
          DISPATCH_MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time }}
          QJSON_FUZZ_OUTPUT_DIR: ${{ runner.temp }}/qjson-fuzz
        run: |
          set -euo pipefail
          max_total_time="${DISPATCH_MAX_TOTAL_TIME:-}"
          if [ -z "$max_total_time" ]; then
              max_total_time=60
          fi
          if ! [[ "$max_total_time" =~ ^[1-9][0-9]*$ ]]; then
              echo "max_total_time must be a positive integer, got '$max_total_time'" >&2
              exit 1
          fi

          QJSON_FUZZ_SECONDS="$max_total_time" make bounded-fuzz

      - name: Preserve failing fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-artifacts
          path: ${{ runner.temp }}/qjson-fuzz/**/artifacts/
          if-no-files-found: ignore
