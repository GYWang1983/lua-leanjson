[package]
name = "leanjson"
version = "0.1.0"
edition = "2021"
description = "Memory-conscious JSON processing for LuaJIT and OpenResty"
license = "Apache-2.0"
repository = "https://github.com/GYWang1983/lua-leanjson"
homepage = "https://github.com/GYWang1983/lua-leanjson"

[lib]
name = "leanjson"
crate-type = ["cdylib", "rlib"]

[features]
default    = ["avx2"]
avx2       = []
test-panic = []

[dependencies]
memchr = "2"
rustc-hash = "2"
once_cell = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"
num-traits = "0.2"
regress = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fluent-uri = "0.4"

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "rust_bench"
harness = false
