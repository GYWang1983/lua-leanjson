name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing stable tag version, for example 0.1.1"
        required: true
        default: "0.1.1"
      publish:
        description: "Publish verified packages to LuaRocks and GitHub"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luarocks-release
  cancel-in-progress: false

jobs:
  source:
    name: Package exact-tag source
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release identity and notes
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git rev-parse --verify "refs/tags/v$version^{commit}" > /dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$GITHUB_SHA"
          else
            test "$PUBLISH" = false
            echo "Preflight of the exact commit before creating v$version"
          fi
          git merge-base --is-ancestor origin/main HEAD
          test -f "rockspec/lua-leanjson-$version-1.rockspec"
          test -s "docs/releases/$version.en.md"
          test -s "docs/releases/$version.zh-CN.md"
          test -s docs/verification/full-verification.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check publication tooling
        run: python3 -m unittest discover -s tests -p test_publish_rocks.py -v

      - name: Install source packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks

      - name: Pack immutable source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          if git -C "$GITHUB_WORKSPACE" rev-parse --verify "refs/tags/v$VERSION" > /dev/null 2>&1; then
            luarocks pack "$GITHUB_WORKSPACE/rockspec/lua-leanjson-$VERSION-1.rockspec"
          else
            # Preflight only: a source rock contains its rockspec and source
            # archive. Use the exact candidate tree before its public tag exists.
            git -C "$GITHUB_WORKSPACE" archive --format=tar.gz \
              --prefix="lua-leanjson-$VERSION/" HEAD > "v$VERSION.tar.gz"
            python3 - <<'PYZIP'
          import os
          from pathlib import Path
          import zipfile
          version = os.environ['VERSION']
          spec = Path(os.environ['GITHUB_WORKSPACE']) / 'rockspec' / ('lua-leanjson-' + version + '-1.rockspec')
          source = Path('v' + version + '.tar.gz')
          with zipfile.ZipFile('lua-leanjson-' + version + '-1.src.rock', 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write(spec, spec.name)
              archive.write(source, source.name)
          source.unlink()
          PYZIP
          fi
          cp "$GITHUB_WORKSPACE/rockspec/lua-leanjson-$VERSION-1.rockspec" .
          cp "$GITHUB_WORKSPACE/docs/releases/$VERSION.en.md" RELEASE_NOTES.en.md
          cp "$GITHUB_WORKSPACE/docs/releases/$VERSION.zh-CN.md" RELEASE_NOTES.zh-CN.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error

  binary:
    name: Binary rock (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: linux-x86_64
          - runner: ubuntu-22.04-arm
            arch: linux-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: dist

      - name: Install pinned toolchain and packaging tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup default 1.90.0
          sudo apt-get update
          sudo apt-get install -y luarocks luajit binutils ripgrep

      - name: Build and verify installed source and binary rocks
        env:
          VERSION: ${{ needs.source.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: .github/scripts/build-release-rock.sh "$VERSION" "$EXPECTED_ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.${{ matrix.arch }}.rock
            dist/build-info.${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    name: Publish matching LuaRocks and GitHub artifacts
    if: github.event_name == 'push' || inputs.publish
    needs: [source, binary]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums and bilingual release body
        run: |
          set -euo pipefail
          (cd dist && sha256sum *) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          cat dist/RELEASE_NOTES.en.md > "$RUNNER_TEMP/release-notes.md"
          printf '\n---\n\n' >> "$RUNNER_TEMP/release-notes.md"
          cat dist/RELEASE_NOTES.zh-CN.md >> "$RUNNER_TEMP/release-notes.md"

      - name: Stage GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" dist/* --verify-tag --draft \
              --title "LeanJSON $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish source and both binary rocks
        env:
          LUAROCKS_TOKEN: ${{ secrets.LUAROCKS_TOKEN }}
          VERSION: ${{ needs.source.outputs.version }}
        run: python3 .github/scripts/publish-rocks.py dist --version "$VERSION"

      - name: Verify LuaRocks downloads
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/luarocks-downloads"
          for file in dist/*.rock dist/*.rockspec; do
            name=$(basename "$file")
            curl --fail --location --retry 10 --retry-delay 3 --retry-all-errors \
              "https://luarocks.org/$name" -o "$RUNNER_TEMP/luarocks-downloads/$name"
            cmp "$file" "$RUNNER_TEMP/luarocks-downloads/$name"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest
