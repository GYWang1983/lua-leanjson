worker_processes 1;
daemon off;
pid /tmp/leanjson-logs/nginx.pid;
error_log /dev/stderr info;
env LD_LIBRARY_PATH;
env LEANJSON_UPSTREAM_HOST;
env LEANJSON_UPSTREAM_PORT;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    lua_package_path '/opt/leanjson/lua/?.lua;/opt/leanjson/examples/?.lua;;';
    lua_check_client_abort on;
    client_max_body_size 256m;
    client_body_buffer_size 64k;
    client_body_temp_path /tmp/leanjson-body;
    client_body_timeout 30s;
    server {
        listen 8080;
        http2 on;
        location / { content_by_lua_file /opt/leanjson/examples/handler.lua; }
    }
    # A bounded test sink. Set LEANJSON_UPSTREAM_HOST/PORT to use another HTTP sink.
    server {
        listen 127.0.0.1:8081;
        location / { content_by_lua_file /opt/leanjson/examples/sink.lua; }
    }
}
